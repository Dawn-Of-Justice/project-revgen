# fly.toml app configuration file generated for project-revgen on 2026-08-04T18:42:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'project-revgen'
primary_region = 'bom'

[build]

[env]
  DATA_DIR = '/data'
  MQTT_PORT = '8883'
  MQTT_TLS = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 16
    soft_limit = 8

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
