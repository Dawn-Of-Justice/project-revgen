# fly.toml -- RevGen backend
#
# Regenerated by `fly launch` on 2026-08-04. Values below are Fly's; the
# comments are ours and explain which ones are load-bearing. If Fly rewrites
# this file again, check these four things survived:
#   auto_stop_machines = 'off', min_machines_running = 1, memory 512mb, bom.

app = 'project-revgen'

# Mumbai: closest region to Kerala. Every 100ms of network latency comes
# straight out of the 1.2s budget for starting her spoken confirmation.
primary_region = 'bom'

[build]

[env]
  DATA_DIR = '/data'
  # Hosted brokers (HiveMQ Cloud, EMQX) are TLS on 8883.
  MQTT_PORT = '8883'
  MQTT_TLS = 'true'

[http_service]
  internal_port = 8080
  force_https = true

  # Do NOT let Fly stop the machine. A cold start would add seconds to the
  # first command of the morning, which is the one she is least patient with.
  # One warm shared-cpu-1x machine is within the free allowance.
  auto_stop_machines = 'off'
  auto_start_machines = true

  # Never raise this above 1, and never `fly scale count 2`.
  #
  # The power debounce lives in process memory (resolver.State). A second
  # machine would keep its own timer, so her repeated "TV on" would reach an
  # instance that has no record of the first one and fire a second toggle --
  # switching the television back off. The failure is silent and intermittent,
  # which makes it about the worst bug this project could ship.
  #
  # Scaling out requires moving State to a shared store first.
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 16
    soft_limit = 8

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

# Persists the TTS cache and the utterance log across deploys. Without it every
# deploy regenerates ~20 phrases against the bulbul:v3 rate limit and throws
# away the log you need to debug her problems from a distance.
#
# Created 2026-08-04 as vol_491omp2jwqo10n9rture (bom, 1GB, encrypted, daily
# snapshots kept 5 days). Recreate with:
#
#   fly volumes create revgen_data --region bom --size 1
#
# Fly warns that a single volume pins the app to one physical host and suggests
# two. We deliberately run one, because a second volume implies a second
# machine, and a second machine would keep its own power-debounce timer -- see
# min_machines_running above. The volume holds only the TTS cache (regenerable)
# and the utterance log, so the blast radius is bounded.
#
[[mounts]]
  source = 'revgen_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
